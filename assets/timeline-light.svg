<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Timeline: ~2018, The spark (Curious about how software works); college, Computer Science (Technical college program); build, Full-stack apps (Front ends, APIs and databases); focus, Backend (Java &amp; Spring Boot, clean architecture); now, Software Engineering (Génie logiciel).">
<title>Timeline: ~2018, The spark (Curious about how software works); college, Computer Science (Technical college program); build, Full-stack apps (Front ends, APIs and databases); focus, Backend (Java &amp; Spring Boot, clean architecture); now, Software Engineering (Génie logiciel).</title>
<style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
</style>
<line x1="24" y1="64" x2="976" y2="64" stroke="#d0d7de" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
<line x1="96" y1="64" x2="904" y2="64" stroke="#1f2328" stroke-width="2" stroke-dasharray="808" stroke-dashoffset="808">
  <animate attributeName="stroke-dashoffset" from="808" to="0" dur="2.4s" begin="0.3s" fill="freeze"/></line>
<circle cy="64" r="3" fill="#1f2328" opacity="0">
  <set attributeName="opacity" to="1" begin="2.6999999999999997s" fill="freeze"/>
  <animate attributeName="cx" values="96;904" dur="5s" begin="2.6999999999999997s" repeatCount="indefinite"/></circle>
  <g class="pop" style="animation-delay:0.3s">
    
    <circle cx="96" cy="64" r="7" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
