.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
</style>
<line x1="24" y1="64" x2="976" y2="64" stroke="#30363d" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
