<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="01 About">
<title>01 About</title>
<style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}</style>
<g class="rise">
  <text x="2" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#16a34a">01</text>
  <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#59636e">/</text>
  <text x="46" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-.4" fill="#1f2328">About</text>
  <text x="998" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#59636e">~/whoami</text>
</g>
<line x1="133" y1="33" x2="920" y2="33" stroke="#d0d7de" stroke-dasharray="787" stroke-dashoffset="787">
  <animate attributeName="stroke-dashoffset" from="787" to="0" dur="1.2s" begin=".2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></line>
<circle cx="133" cy="33" r="2.5" fill="#1f2328" opacity="0">
  <set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>
  <animate attributeName="cx" values="133;920;133" dur="9s" begin="1.4s" repeatCount="indefinite"/></circle>
</svg>
