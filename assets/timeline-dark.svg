<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Timeline: ~2018, The spark (Curious about how software works); college, Computer Science (Technical college program); study, Software Engineering (Génie logiciel); build, Full-stack apps (Front ends, APIs and databases); focus, Backend (Java &amp; Spring Boot, clean architecture); next, First role (Internship or junior backend dev).">
<title>Timeline: ~2018, The spark (Curious about how software works); college, Computer Science (Technical college program); study, Software Engineering (Génie logiciel); build, Full-stack apps (Front ends, APIs and databases); focus, Backend (Java &amp; Spring Boot, clean architecture); next, First role (Internship or junior backend dev).</title>
<style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
