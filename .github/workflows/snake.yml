# Builds the stats card and the black & white contribution "snake", then publishes both to the `output` branch.
# Runs every day, on every push to main, and on demand (Actions tab -> Run workflow).
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: node .github/scripts/stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#c6cbd1,#959da5,#586069,#24292e
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#30363d,#6e7681,#b1bac4,#f0f6fc

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
