    <text x="96" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">The spark</text>
    <text x="96" y="121" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">Curious about how</text><text x="96" y="139" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">software works</text>
  </g>
  <g class="pop" style="animation-delay:0.9s">
    
    <circle cx="298" cy="64" r="7" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="298" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#59636e">COLLEGE</text>
    <text x="298" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Computer Science</text>
    <text x="298" y="121" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">Technical college</text><text x="298" y="139" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">program</text>
  </g>
  <g class="pop" style="animation-delay:1.5s">
    
    <circle cx="500" cy="64" r="7" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="500" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#59636e">BUILD</text>
    <text x="500" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Full-stack apps</text>
    <text x="500" y="121" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">Front ends, APIs</text><text x="500" y="139" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">and databases</text>
  </g>
  <g class="pop" style="animation-delay:2.1s">
    
    <circle cx="702" cy="64" r="7" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <text x="702" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#59636e">FOCUS</text>
    <text x="702" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Backend</text>
    <text x="702" y="121" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">Java &amp; Spring Boot,</text><text x="702" y="139" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">clean architecture</text>
  </g>
  <g class="pop" style="animation-delay:2.7s">
    <circle cx="904" cy="64" r="7" fill="none" stroke="#16a34a" stroke-width="2"><animate attributeName="r" values="7;17" dur="1.8s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="904" cy="64" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
    <text x="904" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#16a34a">NOW</text>
    <text x="904" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Software Engineering</text>
    <text x="904" y="121" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">Génie logiciel</text>
